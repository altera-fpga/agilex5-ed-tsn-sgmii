name: Build Hardware mdk concurrent 3x2.5G design
on:
  workflow_dispatch:
  workflow_call:
    secrets:
        PSGPAC_SSH_KEY:
          required: true
        SSH_HOST_KEY:
          required: true
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""  

jobs:
  hardware-build:
    #runs-on: altera-innersource.prod.amr.dind
    runs-on: self-hosted
    #container: cache-registry.altera.com/cache/library/alpine:3.21
    env:
      SSH_HOST: psgpac@ascycron2.sc.altera.com
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/hw/${{ github.run_id }}.${{ github.run_attempt }}
      REPO: https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
      SED_ARTIFACT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/build
      SED_REGRESSION_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests
      SED_TSN_CFG3_HW_PATH: tsn-cfg3/agilex5/sm72/mdk_3x2.5G
      ARTIFACT_NAME_PREFIX: agilex5-sm72-ed-tsn-cfg3-mdk_3x2.5G

    steps:
      - name: Capture start time
        id: start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      # - name: Install packages
      #   run: |
      #     apk update
      #     apk add git openssh-client rsync

      # - name: Setup ssh
      #   run: |
      #     umask 077
      #     mkdir -p /root/.ssh
      #     echo '${{ secrets.PSGPAC_SSH_KEY }}' > /root/.ssh/id_ed25519
      #     echo '${{ env.SSH_HOST }} ${{ secrets.SSH_HOST_KEY }}' >> /root/.ssh/known_hosts
      #     echo ServerAliveInterval 30 >> /root/.ssh/config
      #     echo User psgpac >> /root/.ssh/config

      - name: Create workdir
        id: workdir
        run: |
          ssh "$SSH_HOST" "mkdir -pv $WORKDIR"
      
      - name: Get date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy inputs
        run: |
          rsync -rl --exclude=.git "$GITHUB_WORKSPACE"/. "$SSH_HOST":"$WORKDIR"

      - name: Create BUILD PATH DIR
        if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
        run: |
          set -x
          if [[ ${{ inputs.triggered_by_schedule }} == "true" ]]; then
            echo " Scheduled event triggered"
            echo "ARTIFACT_NAME_PREFIX=${{ env.ARTIFACT_NAME_PREFIX }}-${{ env.DATE }}" >> $GITHUB_ENV
            echo "BUILD_PATH=${{ env.SED_ARTIFACT_PATH }}/${{ env.SED_TSN_CFG3_HW_PATH }}/${{ env.DATE }}" >> $GITHUB_ENV
            echo "TIME_DIR=${{ env.SED_ARTIFACT_PATH }}/${{ env.SED_TSN_CFG3_HW_PATH }}/${{ env.DATE }}/timing" >> $GITHUB_ENV
          elif [[ ${{ inputs.triggered_by_tag_push }} == "true" ]]; then
            echo " Push Tag triggered"
            echo "ARTIFACT_NAME_PREFIX=${{ env.ARTIFACT_NAME_PREFIX }}-${{ inputs.release_tag }}-${{ env.DATE }}" >> $GITHUB_ENV
            echo "BUILD_PATH=${{ env.SED_ARTIFACT_PATH }}/release/${{ env.SED_TSN_CFG3_HW_PATH }}/${{ inputs.release_tag }}/${{ env.DATE }}" >> $GITHUB_ENV
            echo "TIME_DIR=${{ env.SED_ARTIFACT_PATH }}/release/${{ env.SED_TSN_CFG3_HW_PATH }}/${{ inputs.release_tag }}/${{ env.DATE }}/timing" >> $GITHUB_ENV
          fi    
     
      - name: store run id
        run: |
          ssh "$SSH_HOST" mkdir -pv ${{ env.BUILD_PATH }}
          ssh "$SSH_HOST" 'echo '"${{ github.run_id }}"' > ${{ env.BUILD_PATH }}/run_id'

      - name: Build design
        run: |
          if [[ ${{ inputs.triggered_by_schedule }} == "true" || ${{ inputs.triggered_by_tag_push }} == "true" ]] ; then
            ssh "$SSH_HOST" "mkdir -pv  ${{ env.BUILD_PATH }}/reports"
            ssh "$SSH_HOST" "arc submit --watch ostype/suse15 ncpus=4 mem=48G priority=99 timeout=4h iwd=$WORKDIR -- BUILD_PATH=${{ env.BUILD_PATH }} scripts/build-hw-mdk-3x2.5G.sh"
          else
            echo "Triggered Manually"
            ssh "$SSH_HOST" "arc submit --watch ostype/suse15 ncpus=4 mem=48G priority=99 timeout=4h iwd=$WORKDIR -- scripts/build-hw-mdk-3x2.5G.sh"
          fi
      
      - name: DRC check
        if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
        run: |
          ssh -t "$SSH_HOST" << 'EOF'
          set -x
          mkdir -pv ${{ env.BUILD_PATH }}/build_flags
          mkdir -pv ${{ env.BUILD_PATH }}/reports
          cd  ${{ env.WORKDIR }}; git clone ${{ env.REPO }}
          cd applications.fpga.system-example-designs.test-automation/scripts/drc
          python3 extract_warnings.py --drc  ${{ env.WORKDIR }}/src/hw/a5e065bb32aes1_mdk_3x2.5G/output_files/a5ed065bb32ae6sr0.tq.drc.signoff.rpt
          sleep 5
          cp -rf drc_output.txt ${{ env.BUILD_PATH }}/reports
          if [ -f drc_output.txt ] && [ ! -s drc_output.txt ]; then
            echo "drc_output.txt File exists and is empty"
            touch ${{ env.BUILD_PATH }}/build_flags/drc_pass
          else
            echo "drc_output.txt File exists and is non empty"
            touch ${{ env.BUILD_PATH }}/build_flags/drc_fail
          fi
          EOF

      - name: Copy outputs
        run: |
          rsync -ri "$SSH_HOST":"$WORKDIR"/src/hw/a5e065bb32aes1_mdk_3x2.5G/output_files/. .
          if [[ ${{ inputs.triggered_by_schedule }} == "true" || ${{ inputs.triggered_by_tag_push }} == "true" ]] ; then
            rsync -ri "$SSH_HOST":${{ env.BUILD_PATH }}/reports/drc_output.txt .
          fi

      - name: Upload artifacts to github server
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_PREFIX }}-hw-${{ github.run_id }}
          if-no-files-found: error
          path: |
            *.rbf
            *.sof
            drc_output.txt
          
      - name: Copy artifacts to psg 
        if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
        run: |
          ssh "$SSH_HOST" "mkdir -pv  ${{ env.BUILD_PATH }}/hw && \
          cd $WORKDIR/src/hw/a5e065bb32aes1_mdk_3x2.5G/output_files/;cp -rf *.sof *.rbf ${{ env.BUILD_PATH }}/hw && \
          rm -rf ${{ env.BUILD_PATH }}/hw/*_hps_auto.sof && \
          cd ${{ env.BUILD_PATH }}/hw/ && \
          mv mdk_3x2.5G.core.rbf ${{ env.ARTIFACT_NAME_PREFIX }}.core.rbf && \
          mv mdk_3x2.5G.hps.rbf ${{ env.ARTIFACT_NAME_PREFIX }}.hps.rbf && \
          mv top.sof ${{ env.ARTIFACT_NAME_PREFIX }}.sof && \
          mv top_hps.sof ${{ env.ARTIFACT_NAME_PREFIX }}.hps.sof && \
          cd ${{ env.BUILD_PATH }}/../ && [ -L latest ] && rm -rf latest;ln -s ${{ env.DATE }} latest && \
          mkdir -pv ${{ env.BUILD_PATH }}/build_flags ${{ env.TIME_DIR }} && \
          touch ${{ env.BUILD_PATH }}/build_flags/hardware_done"
               
      - name: Capture end time and calculate duration
        if: always() && (inputs.triggered_by_schedule || inputs.triggered_by_tag_push)
        run: |
          start=${{ steps.start.outputs.start_time }}
          end=$(date +%s)
          duration=$((end - start))
          hours=$((duration / 3600))
          minutes=$(((duration % 3600) / 60))
          seconds=$((duration % 60))
          formatted_duration=$(printf "%02d:%02d:%02d" $hours $minutes $seconds)
          echo "Workflow duration: $formatted_duration"
          ssh "$SSH_HOST" "mkdir -pv ${{ env.TIME_DIR }}"
          ssh "$SSH_HOST" 'echo '"$formatted_duration"' > ${{ env.TIME_DIR }}/hw_time'
          ssh "$SSH_HOST" "cd ${{ env.BUILD_PATH }}/../ && [ -L latest ] && rm -rf latest;ln -s ${{ env.DATE }} latest"
          
      - name: Purge workdir
        if: always()
        run: |
          ssh "$SSH_HOST" "rm -rf $WORKDIR"
