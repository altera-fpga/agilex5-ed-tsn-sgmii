# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"


# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-altera-tsn-sgmii"
BBFILE_PATTERN_meta-altera-tsn-sgmii = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-altera-tsn-sgmii = "6"

LAYERDEPENDS_meta-altera-tsn-sgmii = "core meta-intel-fpga-refdes meta-intel-fpga"
LAYERSERIES_COMPAT_meta-altera-tsn-sgmii = "master walnascar"
BBDEBUG = "yes"


